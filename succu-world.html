<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUCCU WORLD | SuccuChan</title>
<meta name="description" content="SuccuChanの日常4コマ劇場。">
<link rel="icon" type="image/webp" href="assets/webp/logo_symbol.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Archivo:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/site.css">
<script defer src="assets/js/site.js"></script>
</head>
<body>
<main class="page">
  <section class="page-intro">
    <div class="container">
      <span class="eyebrow">Succu World</span>
      <h1 class="big" style="margin-top:14px">SUCCU WORLD<span class="jp">サキュちゃんたちの日常 4コマ</span></h1>
      <p class="lead">6人＋愛猫NOXの、ちょっとデビルな毎日。ここでは日常の4コマをまとめて楽しめます。<br>公式Xの <b style="color:var(--accent)">#サキュワールド</b> でも更新中。</p>
    </div>
  </section>
  <section class="sect--tight">
    <div class="container">
      <div class="chip-row">
        <span class="chip" data-active>ALL</span>
        <span class="chip">RAY</span><span class="chip">MAYU</span><span class="chip">AYA</span>
        <span class="chip">HIKA</span><span class="chip">KOTO</span><span class="chip">RINA</span><span class="chip">NOX</span>
      </div>
      <div class="card-grid cols-4" data-skeleton data-count="8" data-ratio="portrait"></div>
    </div>
  </section>
</main>
<script>
(function(){
  var ph='<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.querySelectorAll('[data-skeleton]').forEach(function(g){
    var n=+g.dataset.count||6, html='';
    for(var i=0;i<n;i++){
      html+='<div class="gcard"><div class="ph">'+ph+'</div><div class="cap"><div class="t">エピソードタイトル</div><div class="m">2026.0'+((i%9)+1)+'.0'+((i%9)+1)+'</div><div class="tags"><span>日常</span><span>4コマ</span></div></div></div>';
    }
    g.innerHTML=html;
  });
})();
</script>
</body>
</html>
